server:
  tomcat:
    threads:
      min-spare: 5
      max: 20

spring:
  application:
    name: subscriptions-app

  datasource:
    url: jdbc:postgresql://localhost:5432/subscription_db
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  subscription:
    default-free-tier-days: 36500
    tier-order:
      - FREE
      - SILVER
      - GOLD
      - PREMIUM
    tier-rules:
      FREE:
        min-order-count: -1
        min-monthly-order-value: 0
        cohorts:
          - STANDARD
          - EARLY_ADOPTER
          - EMPLOYEE
      SILVER:
        min-order-count: 5
        min-monthly-order-value: 1000
        cohorts:
          - STANDARD
          - EARLY_ADOPTER
          - EMPLOYEE
      GOLD:
        min-order-count: 15
        min-monthly-order-value: 5000
        cohorts:
          - EARLY_ADOPTER
          - EMPLOYEE
      PREMIUM:
        min-order-count: 30
        min-monthly-order-value: 15000
        cohorts:
          - EMPLOYEE